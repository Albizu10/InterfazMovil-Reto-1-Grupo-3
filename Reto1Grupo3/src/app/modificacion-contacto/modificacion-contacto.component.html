<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/contactos"></ion-back-button>
    </ion-buttons>
    <div class="toolbar-inline">
      <ion-title >{{contacto[0].name}}</ion-title>
      <ion-buttons>
        <ion-button color="primary" (click)="eliminar()">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-button>
        <ion-button color="primary" (click)="modificar()">
          <ion-icon slot="icon-only" name="checkmark"></ion-icon>
        </ion-button>
      </ion-buttons>
    </div>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">
  <ion-card>

    <img [src]="'data:image/png;base64,' + contacto[0].image_1920"
      style="width:150px; height:auto; margin:10px; margin-left: 10px;">

    <ion-list>
      <ion-item>
        <ion-label position="stacked">Nombre</ion-label>
        <ion-input  [(ngModel)]="contacto[0].name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Teléfono</ion-label>
        <ion-input   [(ngModel)]="contacto[0].phone"></ion-input>
      </ion-item>


      <ion-item>
        <ion-label position="stacked">Correo</ion-label>
        <ion-input  [(ngModel)]="contacto[0].email"></ion-input>
      </ion-item>
<ion-item>
  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-label position="stacked">Ciudad</ion-label>
        <ion-input [(ngModel)]="contacto[0].city"></ion-input>
      </ion-col>

      <ion-col size="6">
        <ion-label position="stacked">Calle</ion-label>
        <ion-input [(ngModel)]="contacto[0].street"></ion-input>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-item>

      <ion-item>
        <ion-label position="stacked">NIF / VAT</ion-label>
        <ion-input   [(ngModel)]="contacto[0].vat"></ion-input>
      </ion-item>

      <ion-item>
            <ion-label position="stacked">Puesto de trabajo</ion-label>
            <ion-input type="text" name="job" [(ngModel)]="contacto[0].function" required></ion-input>
          </ion-item>

    </ion-list>
  </ion-card>
</ion-content>
